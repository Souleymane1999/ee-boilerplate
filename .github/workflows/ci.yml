name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test
      # Secret de test uniquement (pas de RAILS_MASTER_KEY en CI) — voir
      # config/initializers/devise.rb, fallback ENV pour jwt.secret.
      DEVISE_JWT_SECRET_KEY: ci_test_only_secret_not_for_production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Build assets (Tailwind CSS + esbuild)
        run: yarn build:css && yarn build
      - name: Set up database
        run: bin/rails db:schema:load
      - name: Run RSpec
        run: bundle exec rspec

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Brakeman (static security analysis)
        run: bundle exec brakeman --no-pager
      - name: bundler-audit (known CVEs in gems)
        run: |
          bundle exec bundler-audit check --update
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
      - name: yarn audit (known CVEs in JS deps)
        run: yarn install --frozen-lockfile && yarn audit --level high
