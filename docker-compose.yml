services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ee_boilerplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ee_boilerplate}
      POSTGRES_DB: ${POSTGRES_DB:-ee_boilerplate_development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ee_boilerplate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ee_boilerplate:ee_boilerplate@postgres:5432/ee_boilerplate_development}
      RAILS_ENV: ${RAILS_ENV:-development}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/rails
      - app_bundle:/usr/local/bundle
      - app_node_modules:/rails/node_modules
    command: >
      bash -c "bin/rails db:prepare && bin/dev"

volumes:
  postgres_data:
  app_bundle:
  app_node_modules:
